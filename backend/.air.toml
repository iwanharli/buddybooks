root = "."
tmp_dir = "tmp"

[build]
  # CGO_CFLAGS/LDFLAGS: sama seperti Makefile, dibutuhkan gosseract
  # (Tesseract OCR) agar header leptonica ditemukan lewat Homebrew.
  cmd = "CGO_CFLAGS=\"-I$(brew --prefix)/include\" CGO_CPPFLAGS=\"-I$(brew --prefix)/include\" CGO_LDFLAGS=\"-L$(brew --prefix)/lib\" go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "migrations"]
  delay = 300

[log]
  time = false

[misc]
  clean_on_exit = true
